# Optional: `brew install xcodegen && xcodegen generate`
name: SleepTokenKB
options:
  bundleIdPrefix: ai.altivum
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "VMMDK66N53"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  SleepTokenKB:
    type: application
    platform: iOS
    sources:
      - path: SleepTokenKB
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenFanKB
        INFOPLIST_FILE: SleepTokenKB/Info.plist
        CODE_SIGN_ENTITLEMENTS: SleepTokenKB/SleepTokenKB.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: SleepTokenKB/SleepTokenKB.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.altivum.SleepTokenFanKB
    dependencies:
      - target: SleepTokenKeyboard
        embed: true
    info:
      path: SleepTokenKB/Info.plist
      properties:
        CFBundleDisplayName: Sleep Token KB
        UIAppFonts:
          - SleepTokenRunes.ttf

  SleepTokenKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SleepTokenKeyboard
      # Enumerated rather than `- path: Shared` so RuneFont.swift is not linked into the
      # extension: only the host app draws the rune font (Rune Pad), and a keyboard
      # extension has a tight memory budget.
      - path: Shared/Alphabet.swift
      - path: Shared/LayoutMode.swift
      - path: Shared/KeyboardMetrics.swift
      - path: Shared/ShiftState.swift
      - path: Shared/SymbolGlyphView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenFanKB.SleepTokenKeyboard
        INFOPLIST_FILE: SleepTokenKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SleepTokenKeyboard/SleepTokenKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: SleepTokenKeyboard/SleepTokenKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.altivum.SleepTokenFanKB
    info:
      path: SleepTokenKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Sleep Token KB
        # No UIAppFonts here: the extension never draws SleepTokenRunes, it only renders
        # asset-catalog glyph art. The host app keeps its own declaration for Rune Pad.
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController

  SleepTokenKBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepTokenKBTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenFanKBTests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: SleepTokenKB

schemes:
  SleepTokenKB:
    build:
      targets:
        SleepTokenKB: all
        SleepTokenKeyboard: all
        SleepTokenKBTests: [test]
    test:
      config: Debug
      targets:
        - SleepTokenKBTests
    run:
      config: Debug

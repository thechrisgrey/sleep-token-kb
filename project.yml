# Optional: `brew install xcodegen && xcodegen generate`
name: SleepTokenKB
options:
  bundleIdPrefix: ai.altivum
  deploymentTarget:
    # 17.0, not whatever SDK is current. The floor is set by @Observable (Theme.swift)
    # and registerForTraitChanges (KeyboardViewController) — both iOS 17 — and nothing
    # in the app, the extension, or Shared/ needs anything newer; every version-gated
    # symbol was audited against Apple's own availability declarations and the real
    # minimum came out at 17.0, with Shared/ alone as low as 16.0.
    #
    # This WAS "17.0" until it was silently raised to the then-current SDK inside a
    # project-consolidation commit (64862f6). Nobody chose it, and it cost the entire
    # tester base: every build uploaded since required the newest iOS in existence, so
    # TestFlight offered them to almost nobody. A deployment target is a product
    # decision about who can install this, never a side effect of which Xcode built it.
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Altivum Inc, the organization membership that can actually distribute.
    # Not the personal "Christian Rene Perez" team (VMMDK66N53) -- that one signs
    # local development builds fine but owns no App Store Connect account, which
    # makes exportArchive fail with the unhelpful `No Account for Team`.
    DEVELOPMENT_TEAM: "SGS94RW73Z"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  SleepTokenKB:
    type: application
    platform: iOS
    sources:
      - path: SleepTokenKB
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenKB
        INFOPLIST_FILE: SleepTokenKB/Info.plist
        CODE_SIGN_ENTITLEMENTS: SleepTokenKB/SleepTokenKB.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: SleepTokenKB/SleepTokenKB.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.altivum.SleepTokenKB
    dependencies:
      - target: SleepTokenKeyboard
        embed: true
    info:
      path: SleepTokenKB/Info.plist
      properties:
        CFBundleDisplayName: Ritual Keyboard
        # Point the bundle version keys at the build settings instead of literals.
        # Without this, `xcodebuild CURRENT_PROJECT_VERSION=42` silently does nothing
        # and every upload after the first is rejected as a duplicate build number.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app uses no encryption beyond what iOS itself provides, so declaring
        # this up front skips the export-compliance prompt on every single upload.
        ITSAppUsesNonExemptEncryption: false
        # Without this key iOS runs the app in legacy compatibility mode:
        # letterboxed, and reporting a shorter screen that squeezes every layout.
        UILaunchScreen: {}
        # TARGETED_DEVICE_FAMILY is "1,2", and an iPad build must declare all four
        # orientations or App Store Connect rejects the upload outright:
        #   Invalid bundle. No orientations were specified ... (90474)
        # iPhone stays portrait-only, which is what the keyboard and Rune Pad are
        # laid out for; iPad takes all four so multitasking works.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - SleepTokenRunes.ttf

  SleepTokenKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SleepTokenKeyboard
      # Enumerated rather than `- path: Shared` so RuneFont.swift is not linked into the
      # extension: only the host app draws the rune font (Rune Pad), and a keyboard
      # extension has a tight memory budget.
      - path: Shared/Alphabet.swift
      - path: Shared/LayoutMode.swift
      - path: Shared/KeyboardMetrics.swift
      - path: Shared/KeyCenters.swift
      - path: Shared/ShiftState.swift
      - path: Shared/SymbolGlyphView.swift
      # Text-entry rules. Pure functions over the host field's state, kept out of the
      # views so they can be tested without a live UITextDocumentProxy.
      - path: Shared/Autocapitalization.swift
      - path: Shared/AutoShift.swift
      - path: Shared/ReturnKeyTitle.swift
      - path: Shared/PeriodShortcut.swift
      - path: Shared/PageAfterSpace.swift
      - path: Shared/GlideLexicon.swift
      - path: Shared/GlideDecoder.swift
      - path: Shared/GlideSession.swift
      - path: Shared/GlideCommit.swift
      - path: Shared/Resources/glide_lexicon.txt
      - path: Shared/KeyRepeat.swift
      - path: Shared/SpaceTracker.swift
      - path: Shared/CapsLockTap.swift
      - path: Shared/EmojiCatalog.swift
      - path: Shared/Suggestions.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenKB.SleepTokenKeyboard
        INFOPLIST_FILE: SleepTokenKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SleepTokenKeyboard/SleepTokenKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: SleepTokenKeyboard/SleepTokenKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.altivum.SleepTokenKB
    info:
      path: SleepTokenKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Ritual Keyboard
        # Must track the host app exactly: App Store Connect rejects an archive whose
        # embedded extension disagrees with the app on either version key.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No UIAppFonts here: the extension never draws SleepTokenRunes, it only renders
        # asset-catalog glyph art. The host app keeps its own declaration for Rune Pad.
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Declaring this makes the Full Access toggle appear in Settings; it does not
            # grant anything. iOS drops UIFeedbackGenerator events from a keyboard
            # extension until the user turns it on, so key haptics are impossible without
            # it -- the toggle in the app was a no-op while this was false.
            #
            # Everything still degrades: the keyboard checks hasFullAccess before firing
            # feedback, and LayoutMode already falls back to its own UserDefaults when the
            # App Group container is unreachable. There is still no networking code in
            # either target.
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController

  SleepTokenKBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepTokenKBTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.altivum.SleepTokenKBTests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: SleepTokenKB

schemes:
  SleepTokenKB:
    build:
      targets:
        SleepTokenKB: all
        SleepTokenKeyboard: all
        SleepTokenKBTests: [test]
    test:
      config: Debug
      targets:
        - SleepTokenKBTests
    run:
      config: Debug
